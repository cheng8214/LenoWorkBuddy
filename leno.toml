# leno.toml — LenoWorkBuddy 的包配置
#
# 只声明**运行时模块包的版本要求**（[requires]）：
#   模块由 LenoLang 发行包的 leno_module/ 提供，编译器在 `import` 时校验版本。
#   ⇒ 用旧运行时会直接报「模块包 'LenoCompress' 版本 x 不满足项目要求」，
#     而不是等到调用点才报「没有方法」（2026-11-10 补，§5.3）。

[package]
name = "LenoWorkBuddy"
version = "0.1.0"

[requires]
# GUI（窗口 / 控件）
LenoSDL3     = ">=0.1.1"
# HTTPS 客户端（会话接口）
LenoWeb      = ">=1.0.0"
# 摘要与随机
LenoCrypto   = ">=1.1.0"
# gzip / inflate（`gunzip` 现返回 Result[Inflated]，见错误与空值契约）
LenoCompress = ">=0.2.0"
# 分级日志（实例式 logger）
LenoLog      = ">=0.1.0"
# 标准 Result / Option（try_float 用 Option[float]）
LenoResult   = ">=0.1.0"
